<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <meta name="description" content="APK Builder — конвертер, декомпилятор, XAPK→APK и сборщик Android-приложений" />
    <title>APK Builder — студия сборки Android-приложений</title>
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="application-name" content="APK Builder" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="APK Builder" />
    <style>
      html, body { background: #05060a; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: radial-gradient(120% 100% at 50% 0%, #0d1424 0%, #05060a 60%);
        z-index: 9999; transition: opacity .5s ease;
      }
      #boot .l { display: flex; flex-direction: column; align-items: center; gap: 18px; }
      #boot .m {
        width: 62px; height: 62px; border-radius: 18px;
        box-shadow: 0 20px 60px rgba(94,234,212,.28), 0 0 0 1px rgba(255,255,255,.07);
        animation: boot 1.6s cubic-bezier(.6,.05,.2,1) infinite;
        object-fit: cover;
      }
      #boot .s {
        font: 400 11px/1.5 ui-sans-serif, system-ui, sans-serif;
        color: #5c6784; letter-spacing: .02em;
      }
      #boot .t {
        font: 600 12px/1 ui-sans-serif, system-ui, sans-serif; letter-spacing: .28em;
        color: #8b95ad; text-transform: uppercase;
      }
      @keyframes boot {
        0%,100% { transform: scale(.94); opacity: .72 }
        50% { transform: scale(1.02); opacity: 1 }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <div class="l">
        <img class="m" src="./icon-192.png" alt="" width="62" height="62" />
        <div class="t">APK Builder</div>
        <div class="s">студия сборки Android-приложений</div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
